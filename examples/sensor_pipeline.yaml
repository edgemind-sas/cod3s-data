# Sensor Monitoring Pipeline
# Multi-sensor monitoring with filtering and aggregation

name: sensor_monitoring

broker:
  enable_metrics: true
  history_size: 1000

sources:
  # Temperature sensor
  - type: random
    label: "Capteur Température"
    channel: sensors.temperature.room1
    params:
      rate: 10.0           # 10 Hz
      max_messages: 100    # Run for 10 seconds
      min_value: 20.0      # Min temperature (°C)
      max_value: 30.0      # Max temperature (°C)

  # Pressure sensor
  - type: random
    label: "Capteur Pression"
    channel: sensors.pressure.room1
    params:
      rate: 10.0           # 10 Hz
      max_messages: 100
      min_value: 1000.0    # Min pressure (hPa)
      max_value: 1030.0    # Max pressure (hPa)

transformations:
  # Alarm on high temperature (fires only on state transitions)
  - type: alarm
    label: "Alarme haute temp"
    input_channels: sensors.temperature.**
    output_channel: alerts.high_temp
    params:
      max_value: 28.0

  # Calculate average temperature
  - type: aggregate
    label: "Moyenne Température"
    input_channels: sensors.temperature.**
    output_channel: stats.temperature.avg
    params:
      window_type: count
      window_size: 10
      aggregation_fn_code: "lambda msgs: sum(m.value for m in msgs) / len(msgs)"

  # Calculate average pressure
  - type: aggregate
    label: "Moyenne Pression"
    input_channels: sensors.pressure.**
    output_channel: stats.pressure.avg
    params:
      window_type: count
      window_size: 10
      aggregation_fn_code: "lambda msgs: sum(m.value for m in msgs) / len(msgs)"

destinations:
  # Log all raw sensor data
  - type: console
    label: "Log Capteurs"
    channel_pattern: sensors.**
    params: {}

  # Log alerts
  - type: console
    label: "Log Alertes"
    channel_pattern: alerts.**
    params: {}

  # Log statistics
  - type: console
    label: "Log Statistiques"
    channel_pattern: stats.**
    params: {}
