[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cod3s-data"
version = "1.0.0"
description = "Lightweight, flexible data streaming framework for real-time processing of temporal sensor data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "COD3S Team"}
]
keywords = ["streaming", "data-processing", "sensors", "real-time", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "polars>=1.15,<2.0",
    "structlog>=24.0,<25.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Repository = "https://github.com/edgemind-sas/cod3s-data"

[project.optional-dependencies]
observatory = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "websockets>=14.0,<15.0",
]
influxdb = [
    "influxdb-client[async]>=1.40,<2.0",
]
mqtt = [
    "aiomqtt>=2.5,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<5.0",
    "mypy>=1.13,<2.0",
    "ruff>=0.8,<1.0",
    "types-PyYAML>=6.0,<7.0",
    # fastapi.testclient needs httpx; without it the Observatory HTTP and
    # WebSocket surface can only be tested by calling route functions directly.
    "httpx>=0.28,<1.0",
    # MQTTSource's tests parse payloads directly, but importing the module and
    # running the client path needs the mqtt extra present in the dev env.
    "aiomqtt>=2.5,<3.0",
]

[project.scripts]
cod3s-data = "cod3s_data.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cod3s_data*"]

# `py.typed` is what makes the annotations visible outside this package: without
# it a downstream project's type checker treats every symbol here as `Any`, so a
# plugin subclassing `Source` or `Transformation` is checked against nothing —
# which is what the Gemini pipeline had to work around.
#
# The built Observatory UI. Without this, setuptools ships only .py files and
# `pip install 'cod3s-data[observatory]'` serves a 404 on every page while the
# REST and WebSocket APIs work — which is how the omission went unnoticed.
[tool.setuptools.package-data]
cod3s_data = ["py.typed", "observatory/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B027",  # empty method in ABC: sources/destinations expose optional no-op
             # lifecycle hooks that subclasses override only when they need to
]

[tool.ruff.lint.per-file-ignores]
# Test doubles override framework signatures they don't use, and pytest
# fixtures (capsys, ...) are requested as parameters by design.
"tests/**" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "polars.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "influxdb_client.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=cod3s_data",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: tests requiring external services (e.g. Docker)",
]

[tool.coverage.run]
source = ["cod3s_data"]
omit = [
    "tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
