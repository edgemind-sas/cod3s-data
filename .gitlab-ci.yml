# ----------------------------------------------------------------------------
# Pipeline CI cod3s-data — GitLab interne EdgeMind
#
# Stack :
#   - Python 3.12 (uv, uv.lock committé)
#   - Frontend Vue 3 / Vite (Observatory), sous frontend/
#
# Stratégie :
#   - Merge request : lint, typage, tests, build frontend
#   - Push sur main : idem
#   - Tag vX.Y.Z    : idem
#
# Aucun job de publication : le paquet n'est pas encore distribué. Quand il le
# sera, un stage `deploy` viendra après `test`, sur tag uniquement.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Workflow — trois sources de pipeline, et trois seulement : la MR, qui porte
# la validation avant fusion ; `main` ; et un tag. Pousser une branche de
# travail ne déclenche rien, le verdict se rend une fois, sur la MR.
# ----------------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test

default:
  interruptible: true

# ----------------------------------------------------------------------------
# Template hidden : tous les jobs Python en héritent.
#
# `uv sync --frozen` échoue si uv.lock ne correspond plus à pyproject.toml, ce
# qui est le comportement voulu en CI : le lock fait foi, on ne le régénère pas
# silencieusement au milieu d'un pipeline.
#
# --all-extras installe observatory + influxdb : sans eux la moitié du paquet
# n'est ni typée ni testée (le bridge, les routes, la destination InfluxDB).
#
# UV_LINK_MODE=copy : le cache et le venv sont sur des montages distincts dans
# le runner, et uv avertit à chaque install qu'il ne peut pas faire de hardlink.
# ----------------------------------------------------------------------------
.python-job:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: '$CI_PROJECT_DIR/.uv-cache'
    UV_PROJECT_ENVIRONMENT: '$CI_PROJECT_DIR/.venv'
    UV_LINK_MODE: 'copy'
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
      - .venv/
  before_script:
    - uv sync --frozen --all-extras

.ci-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ----------------------------------------------------------------------------
# Stage : check — ruff (lint + format)
#
# Deux commandes dans un seul job : elles portent sur le même outil et la même
# lecture de l'arbre, et un échec de l'une comme de l'autre se corrige par
# `uv run ruff check --fix .` puis `uv run ruff format .`.
# ----------------------------------------------------------------------------
lint:
  extends: .python-job
  stage: check
  script:
    - uv run ruff check .
    - uv run ruff format --check .
  rules: !reference [.ci-rules, rules]

# ----------------------------------------------------------------------------
# Stage : check — mypy strict sur le paquet
#
# Job séparé du lint : ruff et mypy échouent pour des raisons sans rapport, et
# le nom du job en échec doit dire laquelle des deux.
# ----------------------------------------------------------------------------
typecheck:
  extends: .python-job
  stage: check
  script:
    - uv run mypy cod3s_data/
  rules: !reference [.ci-rules, rules]

# ----------------------------------------------------------------------------
# Stage : test — pytest, couverture comprise
#
# Toute la suite, tests d'intégration compris : ils tournent en processus, sauf
# ceux de la destination InfluxDB, qui se désactivent d'eux-mêmes quand aucun
# serveur ne répond. Les faire tourner ici demanderait un `services:` InfluxDB
# et une URL configurable — l'adresse est écrite en dur à localhost:8086 dans
# le test, alors qu'un service GitLab s'adresse par son nom d'hôte. À reprendre
# le jour où le pipeline doit garantir cette destination.
#
# --cov-report=xml s'ajoute aux rapports déclarés dans pyproject.toml : c'est le
# format que GitLab lit pour afficher la couverture dans la MR.
# ----------------------------------------------------------------------------
test:
  extends: .python-job
  stage: test
  script:
    - uv run pytest --cov-report=xml --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules: !reference [.ci-rules, rules]

# ----------------------------------------------------------------------------
# Stage : test — le wheel contient-il l'interface ?
#
# Le paquet a longtemps été construit sans son interface : setuptools ne prend
# que les .py tant qu'on ne déclare pas `package-data`, et rien ne le signalait —
# `create_app()` ne monte le répertoire statique que s'il existe, donc un paquet
# installé servait une API fonctionnelle et un 404 sur chaque page.
#
# Ce job reconstruit le wheel et vérifie qu'il embarque bien l'UI. C'est le seul
# contrôle qui exerce réellement `package-data` : ni les tests ni une install
# editable ne passent par là.
# ----------------------------------------------------------------------------
package:
  extends: .python-job
  stage: test
  script:
    - uv build --wheel --out-dir dist-wheel
    - |
      uv run python - <<'EOF'
      import glob, sys, zipfile
      wheels = glob.glob("dist-wheel/*.whl")
      assert len(wheels) == 1, f"attendu 1 wheel, trouvé {wheels}"
      names = zipfile.ZipFile(wheels[0]).namelist()
      ui = [n for n in names if "/observatory/static/" in n]
      index = "cod3s_data/observatory/static/index.html"
      print(f"{len(names)} fichiers dans le wheel, dont {len(ui)} pour l'interface")
      if index not in names:
          sys.exit(
              f"{index} absent du wheel.\n"
              "Vérifier [tool.setuptools.package-data] dans pyproject.toml et "
              "que cod3s_data/observatory/static/ est bien versionné."
          )
      EOF
  artifacts:
    paths:
      - dist-wheel/
    expire_in: 1 week
  rules: !reference [.ci-rules, rules]

# ----------------------------------------------------------------------------
# Stage : test — build du frontend Observatory
#
# Deux contrôles en un job, parce qu'ils portent sur la même construction.
#
# 1. `npm run build` enchaîne `vue-tsc --noEmit` et `vite build` : c'est le seul
#    endroit où le TypeScript de l'UI est vérifié, `npm run deploy` se contentant
#    de transpiler.
#
# 2. L'artefact construit est versionné dans cod3s_data/observatory/static/,
#    parce que c'est lui qui part dans le wheel. Un artefact versionné se périme
#    dès qu'on touche aux sources sans relancer `npm run deploy` — le job le
#    reconstruit donc et échoue si le résultat diffère de ce qui est commité.
#
#    En cas d'échec sur ce diff : lancer `npm run deploy --prefix frontend` et
#    commiter le résultat. Si le diff ne porte que sur des noms de fichiers
#    hachés alors que les sources n'ont pas bougé, c'est que la chaîne d'outils
#    a changé (version de Node, de vite) et non le code — auquel cas c'est le
#    lockfile ou l'image qu'il faut aligner, pas l'artefact qu'il faut forcer.
# ----------------------------------------------------------------------------
frontend:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    # `git diff` a besoin de git, absent de l'image slim.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
  script:
    - npm ci --prefix frontend --no-audit --no-fund
    - npm run build --prefix frontend
    - npm run deploy --prefix frontend
    - |
      if ! git diff --quiet -- cod3s_data/observatory/static/; then
        echo "L'artefact commité ne correspond plus aux sources du frontend."
        echo "Lancer : npm run deploy --prefix frontend, puis commiter."
        git diff --stat -- cod3s_data/observatory/static/
        exit 1
      fi
    - git status --porcelain -- cod3s_data/observatory/static/
  rules: !reference [.ci-rules, rules]
